# Live browser check of every listed site through Pocket Web, in a real phone-sized Chrome on Google Cloud.
# Run from the repo root: gcloud builds submit --project x300-506418 --config tests/browser/cloudbuild.yaml tests/browser
steps:
- name: mcr.microsoft.com/playwright:v1.49.0-jammy
  entrypoint: bash
  env: ["ONLY=${_ONLY}"]
  args:
  - -c
  - |
    set -e
    npm init -y > /dev/null && npm i --no-save --no-audit --no-fund playwright@1.49.0 > /dev/null
    node peer-check.mjs
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: bash
  args: ["-c", "gcloud storage cp -q -r out/* gs://x300-506418-pulse-videos/pocket-web/peer-checks/$BUILD_ID/"]
substitutions:
  _ONLY: ""
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
